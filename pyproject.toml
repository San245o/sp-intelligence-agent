[project]
name = "signalpost-agent"
version = "0.2.0"
description = "Autonomous Norwegian company intelligence agent with deterministic identity resolution, evidence provenance, and $0.00 spend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "extruct>=0.17,<1",
  "lxml>=5.0,<6",
  "numpy>=1.26,<3",
  "tldextract>=5.1,<6",
  "trafilatura>=1.9,<3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
