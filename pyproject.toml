[project]
name = "signalpost-agent"
version = "0.2.0"
description = "Evidence-backed Norwegian company research with bounded discovery credits and source provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "extruct>=0.17,<1",
  "lxml>=5.0,<7",
  "numpy>=1.26,<3",
  "pydantic>=2.0,<3",
  "tldextract>=5.1,<6",
  "trafilatura>=1.9,<3",
  "google-genai>=0.1.0",
  "pypdf>=6,<7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
