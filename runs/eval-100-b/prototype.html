<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signalpost · Norwegian Corporate Intelligence Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0d14;
  --bg-surface: #101522;
  --bg-card: rgba(22, 29, 45, 0.7);
  --bg-card-hover: rgba(28, 38, 59, 0.85);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-focus: #3b82f6;
  --primary: #3b82f6;
  --primary-glow: rgba(59, 130, 246, 0.25);
  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.2);
  --emerald: #10b981;
  --emerald-glow: rgba(16, 185, 129, 0.2);
  --amber: #f59e0b;
  --rose: #f43f5e;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
  color: var(--text-primary);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Top Navigation Bar */
header.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: rgba(16, 21, 34, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  color: #fff;
  box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
}

.brand-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.brand-tagline {
  font-size: 12px;
  color: var(--text-secondary);
}

.header-badges {
  display: flex;
  align-items: center;
  gap: 12px;
}

.score-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: #34d399;
}

.score-badge .score-value {
  font-weight: 800;
  color: #fff;
  font-size: 14px;
}

.spend-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  color: #60a5fa;
}

/* App Container */
.app-container {
  display: grid;
  grid-template-columns: 380px 1fr;
  flex: 1;
  height: calc(100vh - 73px);
  overflow: hidden;
}

/* Sidebar */
aside.sidebar {
  background: rgba(16, 21, 34, 0.5);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-search-box {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
}

.search-input-wrapper {
  position: relative;
}

.search-input {
  width: 100%;
  padding: 12px 14px 12px 38px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  outline: none;
  transition: all 0.2s;
}

.search-input:focus {
  border-color: var(--border-focus);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}

/* Quick Filters */
.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(0, 0, 0, 0.15);
}

.filter-btn {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  padding: 5px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}

.filter-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
}

.filter-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}

/* Company Master List */
.company-list-header {
  padding: 10px 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
}

.company-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}

.company-list::-webkit-scrollbar {
  width: 6px;
}
.company-list::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
}

.company-card {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-bottom: 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.company-card:hover {
  background: rgba(255, 255, 255, 0.03);
  border-color: var(--border-subtle);
}

.company-card.active {
  background: rgba(59, 130, 246, 0.1);
  border-color: rgba(59, 130, 246, 0.4);
}

.company-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.company-card-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.company-card.active .company-card-name {
  color: #60a5fa;
}

.company-card-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
}

.company-card-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
}

.chip {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.chip-website {
  background: rgba(6, 182, 212, 0.15);
  color: #38bdf8;
  border: 1px solid rgba(6, 182, 212, 0.3);
}

.chip-social {
  background: rgba(99, 102, 241, 0.15);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.3);
}

.chip-reviews {
  background: rgba(245, 158, 11, 0.15);
  color: #fbbf24;
  border: 1px solid rgba(245, 158, 11, 0.3);
}

.chip-employees {
  background: rgba(16, 185, 129, 0.12);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.25);
}

.chip-adverse {
  background: rgba(244, 63, 94, 0.15);
  color: #fb7185;
  border: 1px solid rgba(244, 63, 94, 0.3);
}

/* Main Detail View */
main.detail-panel {
  overflow-y: auto;
  padding: 28px 36px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

main.detail-panel::-webkit-scrollbar {
  width: 8px;
}
main.detail-panel::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 4px;
}

/* Company Hero Section */
.hero-card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
}

.hero-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.hero-title-group h1 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  margin-bottom: 6px;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* Verified Official Website Spotlight Card */
.website-spotlight {
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(59, 130, 246, 0.06));
  border: 1px solid rgba(6, 182, 212, 0.35);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  box-shadow: 0 8px 30px rgba(6, 182, 212, 0.1);
}

.website-spotlight.no-site {
  background: rgba(255, 255, 255, 0.02);
  border: 1px dashed var(--border-subtle);
  box-shadow: none;
}

.website-info {
  display: flex;
  align-items: center;
  gap: 16px;
}

.website-icon-box {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
  border: 1px solid rgba(6, 182, 212, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

.website-details h3 {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
}

.website-verified-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  background: rgba(16, 185, 129, 0.2);
  border: 1px solid rgba(16, 185, 129, 0.4);
  color: #34d399;
  border-radius: 100px;
}

.website-url-text {
  font-family: var(--font-mono);
  font-size: 13px;
  color: #38bdf8;
  margin-top: 4px;
}

.btn-open-website {
  background: linear-gradient(135deg, #0284c7, #06b6d4);
  color: #fff;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  border: none;
  box-shadow: 0 4px 15px rgba(6, 182, 212, 0.35);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
}

.btn-open-website:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
}

/* Two Column Intelligence Layout */
.intel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 20px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Social Channels Grid */
.socials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}

.social-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  text-decoration: none;
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
  transition: all 0.15s;
}

.social-pill:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

.social-pill.linkedin:hover { border-color: #0a66c2; color: #60a5fa; }
.social-pill.facebook:hover { border-color: #1877f2; color: #60a5fa; }
.social-pill.instagram:hover { border-color: #e4405f; color: #f472b6; }
.social-pill.youtube:hover { border-color: #ff0000; color: #f87171; }

/* Google Reviews Banner */
.review-box {
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.25);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.review-stars {
  color: #fbbf24;
  font-size: 16px;
  letter-spacing: 2px;
}

.review-score {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
}

/* Financials Table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.data-table th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 1px solid var(--border-subtle);
}

.data-table td {
  padding: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  color: var(--text-secondary);
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table td.val-strong {
  color: var(--text-primary);
  font-weight: 700;
  font-family: var(--font-mono);
}

/* Agent Synthesis Box */
.synthesis-box {
  background: rgba(59, 130, 246, 0.06);
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  font-size: 13px;
  line-height: 1.6;
  color: #cbd5e1;
}

/* Evidence Drawer */
.evidence-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.evidence-row {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.evidence-span {
  color: var(--text-secondary);
  font-family: var(--font-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 600px;
}

.evidence-link {
  color: #38bdf8;
  text-decoration: none;
}

.empty-state {
  padding: 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
</style>
</head>

let selectedOrg = COMPANIES[0].org;
let currentFilter = 'all';
let searchQuery = '';

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatMoney(val) {
  if (val === null || val === undefined) return '—';
  const num = Number(val);
  const sign = num < 0 ? '-' : '';
  const abs = Math.abs(num);
  if (abs >= 1000000000) return sign + (abs / 1000000000).toFixed(2) + ' mrd NOK';
  if (abs >= 1000000) return sign + (abs / 1000000).toFixed(2) + ' mill NOK';
  if (abs >= 1000) return sign + Math.round(abs).toLocaleString('nb-NO') + ' NOK';
  return sign + Math.round(abs) + ' NOK';
}

function getFilteredCompanies() {
  return COMPANIES.filter(c => {
    if (currentFilter === 'website' && !c.website) return false;
    if (currentFilter === 'social' && (!c.socials || Object.keys(c.socials).length === 0)) return false;
    if (currentFilter === 'reviews' && !c.reviews) return false;
    if (currentFilter === 'employers' && (c.employees === null || c.employees === 0)) return false;
    if (currentFilter === 'adverse' && !c.adverse) return false;
    
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const match = c.name.toLowerCase().includes(q) ||
                    c.org.includes(q) ||
                    (c.municipality && c.municipality.toLowerCase().includes(q)) ||
                    (c.industry && c.industry.toLowerCase().includes(q)) ||
                    (c.website && c.website.toLowerCase().includes(q));
      if (!match) return false;
    }
    return true;
  });
}

function renderSidebar() {
  const filtered = getFilteredCompanies();
  document.getElementById('filteredCount').textContent = `Showing ${filtered.length} of 100 Companies`;
  
  const listEl = document.getElementById('companyList');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No matching companies found.</div>';
    return;
  }
  
  listEl.innerHTML = filtered.map(c => {
    const isActive = c.org === selectedOrg;
    const chips = [];
    if (c.website) chips.push(`<span class="chip chip-website">🌐 ${c.website.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0]}</span>`);
    if (c.socials && Object.keys(c.socials).length > 0) chips.push(`<span class="chip chip-social">📱 ${Object.keys(c.socials).join(', ')}</span>`);
    if (c.reviews) chips.push(`<span class="chip chip-reviews">⭐ ${c.reviews.rating} (${c.reviews.review_count})</span>`);
    if (c.employees !== null) chips.push(`<span class="chip chip-employees">💼 ${c.employees} ansatte</span>`);
    if (c.adverse) chips.push(`<span class="chip chip-adverse">⚠️ Adverse</span>`);
    
    return `
      <div class="company-card ${isActive ? 'active' : ''}" onclick="selectCompany('${c.org}')">
        <div class="company-card-top">
          <div class="company-card-name">${esc(c.name)}</div>
        </div>
        <div class="company-card-sub">
          <span>${c.org}</span>
          <span>•</span>
          <span>${esc(c.legal_form)}</span>
          <span>•</span>
          <span>${esc(c.municipality || 'Norge')}</span>
        </div>
        <div class="company-card-chips">
          ${chips.join('')}
        </div>
      </div>
    `;
  }).join('');
}

            <tr><th>Metric</th><th>Amount</th></tr>
            <tr><td>Total Revenue</td><td class="val-strong">${formatMoney(c.revenue)}</td></tr>
            <tr><td>Operating Result (Driftsresultat)</td><td class="val-strong">${formatMoney(c.operating_result)}</td></tr>
            <tr><td>Net Annual Result (Årsresultat)</td><td class="val-strong">${formatMoney(c.net_result)}</td></tr>
            <tr><td>Total Assets (Sum Eiendeler)</td><td class="val-strong">${formatMoney(c.assets)}</td></tr>
            <tr><td>Equity (Egenkapital)</td><td class="val-strong">${formatMoney(c.equity)}</td></tr>
            <tr><td>Total Liabilities (Gjeld)</td><td class="val-strong">${formatMoney(c.debt)}</td></tr>
          </table>
        ` : `
          <div class="empty-state">No normalized annual account filings on record for this entity in Regnskapsregisteret.</div>
        `}
      </div>
      
      <!-- Corporate Leadership & Operating Locations -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">👥 Leadership & Operating Locations</div>
          <span style="font-size:11px; color:var(--text-muted);">${c.employees !== null ? c.employees + ' employees' : '0 registered'}</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">Registered Leadership</div>
            ${c.leadership && c.leadership.length > 0 ? c.leadership.map(l => `
              <div style="font-size:13px; font-weight:600; color:#fff; display:flex; justify-content:space-between;">
                <span>${esc(l.name)}</span>
                <span style="color:var(--text-secondary); font-size:12px;">${esc(l.role)}</span>
              </div>
            `).join('') : '<div style="font-size:12px; color:var(--text-muted);">No executive leadership roles registered.</div>'}
          </div>
          
          <div style="margin-top:8px; padding-top:10px; border-top:1px solid var(--border-subtle);">
            <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:6px;">Primary Location</div>
            <div style="font-size:12px; color:var(--text-secondary);">${esc(c.address || 'Address not reported in bulk registry')}</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Industry: ${esc(c.industry_code)} ${esc(c.industry)}</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- AI Research Synthesis -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🤖 Signalpost Research Agent Synthesis</div>
        <span style="font-size:11px; color:#34d399;">Deterministic Precision Mode</span>
      </div>
      <div class="synthesis-box">
        ${esc(c.synthesis || `${c.name} (${c.org}) is an officially registered Norwegian entity in ${c.municipality || 'Norway'}.`)}
      </div>
    </div>
    
    <!-- Cryptographic Evidence Audit -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔒 Cryptographic Evidence Audit (SHA-256)</div>
        <span style="font-size:11px; color:var(--text-muted);">${c.evidence_count} Claims Verified</span>
      </div>
      <div class="evidence-list">
        ${c.evidence_items.map(ev => `
          <div class="evidence-row">
            <span class="evidence-span">${esc(ev.claim_span || ev.source_class)}</span>
            <a href="${esc(ev.source_url)}" target="_blank" rel="noopener noreferrer" class="evidence-link">
              Inspect Source ↗
            </a>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function selectCompany(org) {
  selectedOrg = org;
  renderSidebar();
  renderDetail();
}

// Setup Search & Filters
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderSidebar();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderSidebar();
  });
});

// Initial Render
renderSidebar();
renderDetail();
</script>

</body>
</html>
